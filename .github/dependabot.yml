# Cập nhật phụ thuộc tự động: mở PR vào dev, mỗi tháng một lần, gộp các bản nhỏ thành một PR cho mỗi hệ sinh thái.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    groups:
      npm-minor: { update-types: [minor, patch] }

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: dev
    schedule: { interval: monthly }
    groups:
      cargo-minor: { update-types: [minor, patch] }
