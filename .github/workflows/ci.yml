# Kiểm tra: mọi push lên dev, mọi PR vào main / dev, và được release.yml gọi lại trước khi phát hành.
# Không phát hành gì. Chạy trên Windows vì app chỉ build được trên Windows (Windows API, manifest Admin).
name: CI

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'codex/**', '.claude/**']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'codex/**', '.claude/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# push mới lên cùng nhánh / PR -> huỷ lần chạy cũ. Khi release.yml gọi, github.workflow là 'Release' nên không đụng nhau.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Build + lint + test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # target/ dùng chung cho app và crate MCP (build:mcp dùng --target-dir src-tauri/target)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release

      - name: Cài gói npm
        run: npm ci

      - name: Kiểm tra đa ngôn ngữ (khoá thiếu, chữ viết cứng)
        run: node scripts/i18n-check.mjs

      # dist/ phải có trước khi biên dịch Rust (tauri::generate_context! đọc frontendDist)
      - name: Build giao diện
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test (unit)
        working-directory: src-tauri
        run: cargo test --release --lib --locked

      - name: Build MCP server
        run: cargo build --release --locked --manifest-path mcp/Cargo.toml --target-dir src-tauri/target
