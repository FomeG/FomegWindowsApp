# Cargo workspace: app (src-tauri) + MCP server (mcp) dùng chung MỘT Cargo.lock và MỘT thư mục target/ (ở gốc repo).
# Nhờ vậy Dependabot / cargo update chỉ phải sửa một tệp khoá, và MCP không phải biên dịch lại thư viện của app.
[workspace]
members = ["src-tauri", "mcp"]
resolver = "2"

# Profile chỉ có hiệu lực ở gốc workspace.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# CI: như release (cùng manifest Admin, cùng tối ưu cơ bản để test đo thời gian vẫn đúng) nhưng bỏ LTO / codegen-units=1
# – hai thứ chiếm phần lớn thời gian biên dịch. Chỉ dùng để kiểm tra (clippy, test), không để phát hành.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
