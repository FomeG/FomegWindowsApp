[package]
name = "fomeg-windows-app"
version = "0.3.0"
edition = "2021"
description = "Vietnamese's Ultimate W App – Windows startup, services, processes, disk and apps manager (Tauri)"

[lib]
name = "fomeg_windows_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
chrono = "0.4"
ureq = "3"
rust-i18n = "3"
tauri-plugin-updater = "2"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Services",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_TaskScheduler",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Environment",
  "Win32_Security_Cryptography",
  "Win32_System_Performance",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Memory",
  "Win32_System_Kernel",
  "Win32_System_Diagnostics_Debug",
  "Wdk_System_Threading",
  "Wdk_System_SystemInformation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_RemoteDesktop",
  "Win32_Security_Authorization",
  "Win32_System_WindowsProgramming",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Imaging",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Foundation",
  "Foundation_Collections",
  "ApplicationModel",
  "Management_Deployment",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# CI: như release (cùng manifest Admin, cùng tối ưu cơ bản để test đo thời gian vẫn đúng) nhưng bỏ LTO / codegen-units=1
# – hai thứ chiếm phần lớn thời gian biên dịch. Chỉ dùng để kiểm tra (clippy, test), không để phát hành.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
