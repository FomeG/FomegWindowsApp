_version: 2
# Tự cập nhật (src/update.rs)
update.err.disabled:
  vi: Bản này không tự cập nhật (bản tự build). Tải bộ cài mới trên trang phát hành.
  en: This build does not update itself (self-built). Download the new installer from the releases page.
update.err.check:
  vi: "Không kiểm tra được bản mới: %{err}"
  en: "Could not check for updates: %{err}"
update.err.none:
  vi: Chưa có bản mới nào để cài. Bấm Kiểm tra ngay trước.
  en: There is no update to install. Click Check now first.
update.err.install:
  vi: "Không cài được bản mới: %{err}"
  en: "Could not install the update: %{err}"
