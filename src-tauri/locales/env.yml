_version: 2
# Biến môi trường (core/env_vars.rs): lỗi khi sửa / xoá biến.
env.err.scope:
  vi: 'Phạm vi không hợp lệ (chỉ có người dùng hoặc hệ thống).'
  en: 'Invalid scope (only user or system).'
env.err.name:
  vi: 'Tên biến không hợp lệ: không được trống, không có dấu "=" hay khoảng trắng ở đầu / cuối, tối đa 255 ký tự.'
  en: 'Invalid variable name: it can’t be empty, contain "=" or start / end with a space, and has at most 255 characters.'
env.err.protected:
  vi: 'Không xoá được %{name}: Windows và nhiều chương trình cần biến này. Bạn vẫn có thể sửa giá trị.'
  en: 'Can’t delete %{name}: Windows and many programs need it. You can still edit its value.'
env.err.too_long:
  vi: 'Giá trị quá dài (tối đa %{max} ký tự).'
  en: 'The value is too long (at most %{max} characters).'
env.err.empty_path:
  vi: 'Không để trống Path: Windows sẽ không tìm thấy chương trình nào.'
  en: 'Path can’t be empty: Windows would not find any program.'
env.err.no_change:
  vi: 'Không tìm thấy thay đổi này trong lịch sử.'
  en: 'This change is not in the history.'
